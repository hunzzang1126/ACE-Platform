  <circle cx="16" cy="16" r="10" stroke="url(#g)" stroke-width="2.2" fill="none"/>
  <!-- Inner creative spark: diamond/pen tip -->
  <polygon points="16,7 21,16 16,25 11,16" fill="url(#g)" opacity="0.85"/>
  <!-- Center dot: focus point -->
  <circle cx="16" cy="16" r="2" fill="#0a0e1a"/>
